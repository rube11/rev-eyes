AWSTemplateFormatVersion: '2010-09-09'
Description: Creates root-managed runtime and CloudFormation roles for the rev-eyes scheduler.

Parameters:
  SchedulerSecretArn:
    Type: String
    Description: ARN of the backend-owned scheduler secret.
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
  ResourcePrefix:
    Type: String
    Default: rev-eyes
    AllowedPattern: '^[A-Za-z0-9._-]{1,20}$'
  ApplicationStackName:
    Type: String
    Default: rev-eyes-scheduler
    AllowedPattern: '^[A-Za-z][-A-Za-z0-9]{0,127}$'

Resources:
  ScheduleTargetRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${ResourcePrefix}-scheduler-schedule-target'
      Description: Publishes due rev-eyes jobs from EventBridge Scheduler.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSchedulerAssumeRole
            Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${ResourcePrefix}'
      Policies:
        - PolicyName: DeliverScheduledEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishScheduledEvent
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ResourcePrefix}-scheduled-jobs'
              - Sid: SendFailedScheduleToDeadLetterQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ApplicationStackName}-*'
      Tags:
        - Key: Application
          Value: rev-eyes
        - Key: ManagedBy
          Value: root-foundation

  SchedulerInvocationRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${ResourcePrefix}-scheduler-api-destination'
      Description: Lets EventBridge invoke the rev-eyes scheduler API destination.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeAssumeRole
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ResourcePrefix}-scheduled-jobs/${ResourcePrefix}-scheduled-job-delivery'
      Policies:
        - PolicyName: InvokeSchedulerDestination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeSchedulerDestination
                Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:api-destination/${ResourcePrefix}-scheduler/*'
      Tags:
        - Key: Application
          Value: rev-eyes
        - Key: ManagedBy
          Value: root-foundation

  ScheduleRegistrarExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${ResourcePrefix}-scheduler-registrar'
      Description: Registers bounded rev-eyes schedules and publishes immediate jobs.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaAssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RegisterRevEyesSchedules
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateApplicationSchedules
                Effect: Allow
                Action: scheduler:CreateSchedule
                Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ResourcePrefix}/*'
              - Sid: PassScheduleTargetRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ScheduleTargetRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com
              - Sid: PublishImmediateEvents
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ResourcePrefix}-scheduled-jobs'
              - Sid: WriteRegistrarLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-schedule-registrar:*'
      Tags:
        - Key: Application
          Value: rev-eyes
        - Key: ManagedBy
          Value: root-foundation

  SchedulerCloudFormationExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${ResourcePrefix}-scheduler-cloudformation-execution'
      Description: Bounded service role for the rev-eyes scheduler CloudFormation stack.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFormationAssumeRole
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageRevEyesSchedulerResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageScheduleGroup
                Effect: Allow
                Action:
                  - scheduler:CreateScheduleGroup
                  - scheduler:DeleteScheduleGroup
                  - scheduler:GetScheduleGroup
                  - scheduler:ListTagsForResource
                  - scheduler:TagResource
                  - scheduler:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${ResourcePrefix}'
              - Sid: ManageScheduledEventBridgeResources
                Effect: Allow
                Action:
                  - events:CreateEventBus
                  - events:DeleteEventBus
                  - events:DescribeEventBus
                  - events:UpdateEventBus
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:EnableRule
                  - events:DisableRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:CreateConnection
                  - events:UpdateConnection
                  - events:DeleteConnection
                  - events:DeauthorizeConnection
                  - events:DescribeConnection
                  - events:CreateApiDestination
                  - events:UpdateApiDestination
                  - events:DeleteApiDestination
                  - events:DescribeApiDestination
                  - events:TagResource
                  - events:UntagResource
                  - events:ListTagsForResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ResourcePrefix}-scheduled-jobs'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ResourcePrefix}-scheduled-jobs/${ResourcePrefix}-scheduled-job-delivery'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:connection/${ResourcePrefix}-scheduler/*'
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:api-destination/${ResourcePrefix}-scheduler/*'
              - Sid: ManageSchedulerDeadLetterQueue
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:SetQueueAttributes
                  - sqs:ListQueueTags
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ApplicationStackName}-*'
              - Sid: ManageScheduleRegistrarFunction
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ResourcePrefix}-schedule-registrar'
              - Sid: ManageScheduleRegistrarLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-schedule-registrar'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-schedule-registrar:*'
              - Sid: ListScheduleRegistrarLogs
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: ManageScheduleRegistrationApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:UpdateRestApiPolicy
                Resource:
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/*'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
              - Sid: ReadSchedulerSecretForDynamicReference
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SchedulerSecretArn
              - Sid: CreateApiDestinationServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/aws-service-role/apidestinations.events.amazonaws.com/AWSServiceRoleForAmazonEventBridgeApiDestinations'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: apidestinations.events.amazonaws.com
              - Sid: PassRegistrarRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ScheduleRegistrarExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: PassInvocationRoleToEventBridge
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SchedulerInvocationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: events.amazonaws.com
              - Sid: RemoveLegacyStackRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:UntagRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-ScheduleTargetRole-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-SchedulerInvocationRole-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-ScheduleRegistrarExecutionRole-*'
      Tags:
        - Key: Application
          Value: rev-eyes
        - Key: ManagedBy
          Value: root-foundation

Outputs:
  ScheduleTargetRoleArn:
    Description: Fixed EventBridge Scheduler target role ARN.
    Value: !GetAtt ScheduleTargetRole.Arn
  SchedulerInvocationRoleArn:
    Description: Fixed EventBridge API destination invocation role ARN.
    Value: !GetAtt SchedulerInvocationRole.Arn
  ScheduleRegistrarExecutionRoleArn:
    Description: Fixed schedule registrar Lambda execution role ARN.
    Value: !GetAtt ScheduleRegistrarExecutionRole.Arn
  SchedulerCloudFormationExecutionRoleArn:
    Description: Bounded CloudFormation service role ARN.
    Value: !GetAtt SchedulerCloudFormationExecutionRole.Arn
